# A one-off restore (ADR 0010, docs/operations.md "Restore"). Restore is
# offline and takes the data-dir lock without waiting, so the old pod must be
# gone, not just scaled away, before this one starts.
#
#   kubectl scale statefulset hermes --replicas=0
#   kubectl wait --for=delete pod/hermes-0 --timeout=5m
#   kubectl apply -f restore.yaml        # set BACKUP below first
#   kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
#     pod/asphodel-restore --timeout=15m
#   kubectl logs asphodel-restore -c restore
#   kubectl delete pod asphodel-restore
#   kubectl scale statefulset hermes --replicas=1
#
# The pod never restarts, so it ends Succeeded only when both containers
# exited 0. If the wait doesn't succeed, keep the StatefulSet at zero. A
# timeout means the pod may still be running. A failure before the restore
# installs the copy leaves the live store untouched, but an error that names
# a move or the sync of /data itself can leave the old store, the restored
# one, or files part-way between them. docs/operations.md, "Restore", says
# how to tell and how to recover.
#
# The init container fetches the backup with the same rclone secret the
# backup job uses. `asphodel restore` checks its integrity and schema
# version, stages a copy beside the live database, then renames the current
# database aside (it isn't deleted) and the copy into its place.
apiVersion: v1
kind: Pod
metadata:
  name: asphodel-restore
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  initContainers:
    - name: fetch
      image: rclone/rclone:1
      command: [sh, -c]
      args: ['rclone copyto "$DESTINATION/$BACKUP" /backup/asphodel.db']
      env:
        - name: BACKUP
          value: asphodel-20261002T033000Z.db
      envFrom:
        - secretRef:
            name: asphodel-backup
      volumeMounts:
        - name: backup
          mountPath: /backup
  containers:
    - name: restore
      image: registry.example.com/asphodel:0.1.0
      args: [restore, /backup/asphodel.db, --data-dir=/data]
      volumeMounts:
        - name: backup
          mountPath: /backup
          readOnly: true
        - name: data
          mountPath: /data
  volumes:
    - name: backup
      emptyDir:
        sizeLimit: 5Gi
    # The StatefulSet's claim for ordinal 0.
    - name: data
      persistentVolumeClaim:
        claimName: asphodel-data-hermes-0
