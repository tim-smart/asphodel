# Hermes with Asphodel as a native sidecar (docs/operations.md).
#
# Before applying:
#   - push the image `nix build .#image` builds and set it below;
#   - replace the Hermes container with your own;
#   - optionally, create the token secret now, so Hermes, the backup job and
#     the daemon share it from the start:
#       kubectl create secret generic asphodel \
#         --from-literal=token="$(openssl rand -hex 32)"
#
# Then set Asphodel up from its dashboard (docs/operations.md, "First-run
# setup"). With no tuning file in its data dir, the daemon waits for it:
#   kubectl port-forward hermes-0 7720
#   open http://127.0.0.1:7720/dashboard
# Setup asks for no code or token, so anyone who reaches the port first can
# complete it. Run it as soon as the pod first starts, and keep the port
# private until you have. Don't add an Ingress or LoadBalancer yet, and bear
# in mind that the Service below lets other pods in the namespace reach it.
# Setup writes the tuning file and any secrets into the data volume, so they
# survive restarts and nothing else needs mounting. Without the secret above,
# setup makes a token and shows it once: store it as that secret and restart
# the pod, so Hermes and the backup job get it too.
#
# To manage the tuning file yourself instead, mount it from a ConfigMap and
# pass `--config=/etc/asphodel/asphodel.toml`; it wins over the data dir's,
# and setup never runs (docs/operations.md, "The tuning file").
---
# Only the backup CronJob uses this. Hermes reaches the daemon on loopback.
# Until setup is done, it also exposes the setup wizard to the namespace. If
# that matters, apply it after setup or limit port 7720 with a NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: asphodel
spec:
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: asphodel
      port: 7720
      targetPort: asphodel
---
# One replica, always: the daemon holds an exclusive lock on its data dir,
# and a second pod on the same volume would wait on it or fail. A
# StatefulSet never runs two pods for one ordinal. A Deployment works too,
# with `replicas: 1` and `strategy: {type: Recreate}`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
spec:
  replicas: 1
  serviceName: asphodel
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      securityContext:
        # The image runs as 65532. fsGroup gives it the data volume.
        fsGroup: 65532
      # Room for the daemon to finish the chunk in flight on SIGTERM. Native
      # sidecars stop after the main containers, so Hermes stops first.
      terminationGracePeriodSeconds: 120
      initContainers:
        # A native sidecar (Kubernetes 1.29+): an init container that keeps
        # running. Hermes starts once the startup probe passes.
        - name: asphodel
          image: registry.example.com/asphodel:0.1.0
          restartPolicy: Always
          args:
            - serve
            # Off loopback, so the kubelet's probes and the backup job can
            # reach it. That makes the token mandatory for every client.
            - --listen=0.0.0.0:7720
            - --data-dir=/data
          # Both are optional: the environment wins over what setup keeps in
          # the data dir, and setup works without either.
          env:
            - name: ASPHODEL_TOKEN
              valueFrom:
                secretKeyRef: {name: asphodel, key: token, optional: true}
            - name: ASPHODEL_LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: asphodel, key: llm-api-key, optional: true}
          ports:
            - name: asphodel
              containerPort: 7720
          # /v1/health answers 503 while the store migrates and the models
          # load, and 200 once the daemon is ready. While first-run setup
          # waits it answers 200 with `ready: false`, so the pod isn't
          # restarted out from under the wizard. It needs no token.
          startupProbe:
            httpGet: {path: /v1/health, port: asphodel}
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet: {path: /v1/health, port: asphodel}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: asphodel-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: hermes
          image: registry.example.com/hermes:latest
          env:
            - name: ASPHODEL_URL
              value: http://127.0.0.1:7720
            - name: ASPHODEL_TOKEN
              valueFrom:
                secretKeyRef: {name: asphodel, key: token, optional: true}
          # ... the rest of your Hermes container, with the plugin installed
          # under $HERMES_HOME/plugins/asphodel.
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    # A local or block volume. The daemon refuses NFS, SMB/CIFS, CephFS and
    # FUSE unless given --allow-network-fs, because SQLite's locking and WAL
    # aren't safe on them.
    - metadata:
        name: asphodel-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
