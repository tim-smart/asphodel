name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing in CI may reach a model host. fastembed and the ONNX models come
  # from the nix store or the repo, never from a download at build or test time.
  HF_HUB_OFFLINE: "1"
  # The runner ran out of disk linking the test binaries: each statically
  # links fastembed, ort and tokenizers, and full debug info made them
  # 150-230 MB apiece. Without it one is about 27 MB. Incremental state is
  # never reused in CI, so it isn't written.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Only Cargo's downloads are cached. `target` is rebuilt each run: a
      # restored one brought back every earlier head's artifacts and filled
      # the disk.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: nix develop -c cargo fmt --check

      - name: cargo clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: nix develop -c cargo test

  plugin:
    name: plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: pytest
        run: nix develop -c python -m pytest plugin/tests
