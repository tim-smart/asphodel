# A question about the speaker's town, answered by a search. Call 1 keeps
# what the speaker asked about as a same-day record, and the dated show
# the reply found as an event quoted from the reply. The show is on the
# agenda until its window passes.

name = "found-local-event"
group = "ci"
description = "A question about the speaker's life is a same-day record, and a dated finding quoted from the reply stays on the agenda until its window ends."

[bank]
timezone = "UTC"

[[turn]]
at = "2026-10-10T01:00:00Z"
session = "circus"
user = "Will a circus be coming to Springfield anytime soon?"
assistant = "Yes, Cirque Lumen is at the Civic Theatre on 23-25 October, as part of the Springfield Arts Festival."

[[turn.claim]]
label = "asked-about-circus"
content = "Tim wanted to know on 2026-10-10 whether a circus was coming to Springfield."
quote = "Will a circus be coming to Springfield anytime soon?"
kind = "event"
significance = "trivial"

[[turn.claim]]
label = "circus-show"
content = "The Springfield Arts Festival lists Cirque Lumen at the Civic Theatre in Springfield from 2026-10-23 to 2026-10-25."
quote = "Cirque Lumen is at the Civic Theatre on 23-25 October"
kind = "event"
significance = "trivial"
valid_from = { at = "2026-10-23", precision = "day" }
valid_until = { at = "2026-10-25", precision = "day" }

[[probe]]
id = "question-is-a-current-record"
at = "2026-10-10T02:00:00Z"
kind = "exists"
memory = "asked-about-circus"
phase = "current"

[[probe]]
id = "question-not-on-agenda"
at = "2026-10-10T02:00:00Z"
kind = "agenda_lacks"
memory = "asked-about-circus"

[[probe]]
id = "show-on-agenda-before-it"
at = "2026-10-20T09:00:00Z"
kind = "agenda_has"
memory = "circus-show"

[[probe]]
id = "show-leaves-agenda-after-it"
at = "2026-10-27T09:00:00Z"
kind = "agenda_lacks"
memory = "circus-show"
