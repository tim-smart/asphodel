# Tim says his cat is called Miso, then says it again with what she is and
# where she came from. Call 2 labels the repeat mentioned_again, so it's
# absorbed into the memory as a restatement. Ten friends coming home share
# two words each with the question; the cat's own sentence shares none,
# and only the restatement names a ginger tabby from Porirua. Recall that
# searches restatements finds the cat ahead of the ten; recall over the
# memory's own sentence alone ranks it eleventh, past the default limit.

name = "restatement-recall"
group = "ci"
description = "A question only a restatement answers recalls the memory it was absorbed into."

[bank]
timezone = "UTC"

[[turn]]
at = "2026-01-05T09:00:00Z"
session = "s1"
user = "My cat is called Miso."
assistant = "Lovely name."

[[turn.claim]]
label = "cat"
content = "Tim's cat is called Miso."
quote = "My cat is called Miso"
kind = "fact"
significance = "minor"

[[turn]]
at = "2026-01-12T09:00:00Z"
session = "s2"
user = "My cat is called Miso, a ginger tabby from Porirua."
assistant = "Noted."

