content = "Tim's cat is called Miso, a ginger tabby from Porirua."
quote = "My cat is called Miso, a ginger tabby from Porirua"
kind = "fact"
significance = "minor"
reconcile = [{ memory = "cat", outcome = "mentioned_again" }]

