name = "dated-event-reminder"
group = "ci"
description = "A reminder expires when its dated event passes; ordinary overdue and undated tasks stay on the agenda; an event already under way when said is a record, not an agenda item."

[bank]
timezone = "UTC"

[[turn]]
at = "2026-02-09T09:00:00Z"
session = "reminders"
user = "Remind me to bring my insurance card to the dentist appointment on 10 February at 2pm. I also need to organise the garage, with no deadline. I need to renew my passport by 10 February at noon."
assistant = "Noted the tasks."

[[turn.claim]]
label = "dentist-reminder"
content = "Tim needs to bring his insurance card to the dentist appointment on 2026-02-10 at 14:00."
quote = "Remind me to bring my insurance card to the dentist appointment on 10 February at 2pm"
kind = "task"
significance = "minor"
due_at = { at = "2026-02-10T14:00", precision = "minute" }
valid_until = { at = "2026-02-10T14:00", precision = "minute" }

[[turn.claim]]
label = "garage-task"
content = "Tim needs to organise the garage, with no deadline."
quote = "I also need to organise the garage, with no deadline"
kind = "task"
significance = "minor"

[[turn.claim]]
label = "passport-deadline"
content = "Tim needs to renew his passport by 2026-02-10 at noon."
quote = "I need to renew my passport by 10 February at noon"
kind = "task"
significance = "minor"
due_at = { at = "2026-02-10T12:00", precision = "minute" }
# Omitting valid_until scripts a null end: an ordinary deadline is not an expiry.

[[turn]]
at = "2026-02-09T10:00:00Z"
session = "reminders"
user = "The clinic replied to me. I have a check-up on 11 February."
assistant = "Noted."

# No stated time, so it's dated to the day it was said.
[[turn.claim]]
label = "clinic-replied"
content = "The clinic replied to Tim."
quote = "The clinic replied to me"
kind = "event"
significance = "minor"

[[turn.claim]]
label = "check-up"
content = "Tim has a check-up on 2026-02-11."
quote = "I have a check-up on 11 February"
kind = "event"
significance = "minor"
valid_from = { at = "2026-02-11", precision = "day" }

[[probe]]
id = "dated-reminder-before-event"
at = "2026-02-10T13:59:00Z"
kind = "agenda_has"
memory = "dentist-reminder"

[[probe]]
id = "undated-task-before-event"
at = "2026-02-10T13:59:00Z"
kind = "agenda_has"
memory = "garage-task"

[[probe]]
id = "ordinary-overdue-task-before-event"
at = "2026-02-10T13:59:00Z"
kind = "agenda_has"
memory = "passport-deadline"

[[probe]]
id = "dated-reminder-expires-after-event"
at = "2026-02-10T14:01:00Z"
kind = "agenda_lacks"
memory = "dentist-reminder"

[[probe]]
id = "undated-task-after-event"
at = "2026-02-10T14:01:00Z"
kind = "agenda_has"
memory = "garage-task"

[[probe]]
id = "ordinary-overdue-task-after-event"
at = "2026-02-10T14:01:00Z"
kind = "agenda_has"
memory = "passport-deadline"

[[probe]]
id = "same-day-record-not-on-agenda"
at = "2026-02-09T12:00:00Z"
kind = "agenda_lacks"
memory = "clinic-replied"

[[probe]]
id = "same-day-record-is-current"
at = "2026-02-09T12:00:00Z"
kind = "exists"
memory = "clinic-replied"
phase = "current"

[[probe]]
id = "event-said-ahead-on-agenda"
at = "2026-02-09T12:00:00Z"
kind = "agenda_has"
memory = "check-up"
