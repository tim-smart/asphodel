quote = "my daughter is called Ada"
kind = "fact"
significance = "major"

[[turn.claim]]
label = "trivial-thrice"
content = "Tim's bus to work is the number 14."
quote = "my bus to work is the number 14"
kind = "fact"
significance = "trivial"

[[turn.claim]]
label = "trivial-six"
content = "Tim's gym locker is number 37."
quote = "my gym locker is number 37"
kind = "fact"
significance = "trivial"

[[turn.claim]]
