# The purge table through the store, with δ set to 1.0 here rather than
# read from the default, and bank time at world speed. One mention is purged at the first 04:00 sweep after
# strength falls below τ − δ: e^((S·σ − τ + δ) / a) days after the mention,
# which is 128.7 days for trivial, 536.8 for minor and 4576 for notable.
# The exists probes sit 5% before the crossing and the absent probes 5%
# plus a sweep after it. Separate occasions (at least three world days
# apart) lift the lasting floor: trivial on 6 occasions, minor on 3 and
# notable on 2 are never purged, and nothing major is: their lasting
# strength holds them at or above τ − 1, whatever δ is.
#
# The cat is stated again after its memory was purged. Reconciliation has
# nothing to match, so it comes back as a new memory, and the shadow table
# counts it as purged then re-mentioned: 5 purges by the end (the cat, its
# re-mention, the bus, the single minor and the single notable) and
# 1 re-mention, a rate of 0.2.

name = "purge-table"
group = "ci"
description = "One mention is purged at 4 months, 1.5 years or 12.5 years; enough separate occasions, or major significance, is never purged."

[bank]
timezone = "UTC"

[tuning]
clock.quiet_rate = 1.0
purge.delta = 1.0

[[turn]]
at = "2026-01-05T09:00:00Z"
session = "s1"
user = "Some things about me: my neighbour's cat is called Biscuit, I take my coffee black, I grew up in Dunedin, my daughter is called Ada, my bus to work is the number 14, my gym locker is number 37, I take my tea with milk, and I studied physics at Otago."
assistant = "Thanks, I'll remember those."

[[turn.claim]]
label = "trivial"
content = "Tim's neighbour's cat is called Biscuit."
quote = "my neighbour's cat is called Biscuit"
kind = "fact"
significance = "trivial"

[[turn.claim]]
label = "minor"
content = "Tim takes his coffee black."
quote = "I take my coffee black"
kind = "fact"
significance = "minor"

[[turn.claim]]
